[project]
name = "nuh-prql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Peter LaValle", email = "peter.lavalle@nhs.net" }
]
requires-python = ">=3.13"
dependencies = [
    "pyprql>=0.13.0",
]

[project.scripts]
nuh-prql = "nuh_prql:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
